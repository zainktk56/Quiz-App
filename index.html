<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="icon" type="image/png" href="./Qp icon.png">
    <style>
        @font-face {
            font-family: poppins;
            src: url(./Poppins/Poppins-Regular.ttf);
        }

        .main {
            display: flex;
            justify-content: space-evenly;
            font-family: poppins;
        }

        h1 {
            text-align: center;
            margin-right: 100px;
            font-family: poppins;
        }

        #card1 {
            margin-top: 10px;
            border: 1px groove black;
            padding: 10px;
            border-radius: 15px;
            width: 500px;
            text-align: center;
        }

        #card2 {
            margin-top: 10px;
            border: 1px groove black;
            padding: 10px;
            border-radius: 15px;
            width: 300px;
        }

        #btn {
            width: 100%;
            justify-self: center;
            padding: 5px;
            font-family: poppins;
            background-color: greenyellow;
            border-radius: 15px;
            border: 1px solid black;
        }

        .radio-btn {
            transform: scale(1.5);
            margin-right: 15px;
        }

        #report-card {
            color: yellowgreen;
            text-align: center;
            border: 1px solid black;
            background-color: black;
            padding: 15px;
            border-radius: 15px;
        }

        .card_0 {
            border: 1px solid black;
            padding: 20px;
            border-radius: 20px;
            margin-top: 10px;
            text-align: center;
        }

        #left {
            color: yellowgreen;
            padding: 10px;
            border-radius: 15px;
            background-color: black;
        }

        #timer {
            color: rgba(255, 0, 0, 0.868);
        }

        footer {
            text-align: center;
            font-family: poppins;
        }

        /* Responsive Design */
        .main {
            display: flex;
            justify-content: space-evenly;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        #card1 {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        #card2 {
            width: 100%;
            max-width: 300px;
            box-sizing: border-box;
        }

        .card_0 {
            width: 100%;
            max-width: 180px;
            box-sizing: border-box;
        }

        h1 {
            margin-right: 0;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
                align-items: center;
            }

            #card1,
            #card2,
            .card_0 {
                width: 90%;
                max-width: none;
            }

            .radio-btn {
                transform: scale(1.2);
                margin-right: 10px;
            }

            h1 {
                font-size: 28px;
            }

            footer {
                font-size: 14px;
                padding: 10px;
            }
        }

        @media (max-width: 1000px) {
            .main {
                flex-direction: column;
                align-items: center;
            }

            #card1,
            #card2,
            .card_0 {
                width: 90%;
                max-width: 600px;
            }
        }
    </style>
</head>

<body>
    <header>

        <h1>Quiz App</h1>
        <hr>
    </header>
    <main>

        <div class="main">
            <div class="card_0">

                <h3 id="left">Time Left :</h3>
                <h3 id="timer">180</h3>
            </div>
            <div id="card1">
                <h3>Questions</h3>
                <h3 id="question"></h3>


                <input class="radio-btn" onclick="btnClick()" id="r1" type="radio" name="quiz_question">
                <label for="" id="opt1"></label>
                <br>
                <br>
                <input class="radio-btn" onclick="btnClick()" id="r2" type="radio" name="quiz_question">
                <label for="" id="opt2"></label>
                <br>
                <br>
                <input class="radio-btn" onclick="btnClick()" id="r3" type="radio" name="quiz_question">
                <label for="" id="opt3"></label>
                <br>
                <br>



                <button id="btn" disabled onclick="btn()">Next</button>
            </div>
            <div id="card2">
                <h3 id="report-card">Report Card</h3>
                <hr>
                <p id="score"><b>Score : </b> pending... </p>
                <p id="result"><b>Result : </b> pending...</p>
                <p id="conclusion"><b>Conclusion : </b> pending....</p>
            </div>
        </div>
    </main>
    <br><br><br>
    <footer>
        <hr>
        <br>
        <p>&copy; 2026 Quiz App | Developed by Muhammad Zain </p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
